<!doctype html>
<html>
  <head>
    <title>Admin Panel</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dashboard.css') }}"
    />
  </head>

  <body>
    <nav>
      <h2>🛠 Admin Panel</h2>

      <div>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
      </div>
    </nav>

    <div class="table-box">
      <h1>Registered Users</h1>

      <table>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Password</th>
        </tr>

        {% for user in users %}

        <tr>
          <td>{{ user[0] }}</td>
          <td>{{ user[1] }}</td>
          <td>{{ user[2] }}</td>
        </tr>

        {% endfor %}
      </table>
    </div>
  </body>
</html>
